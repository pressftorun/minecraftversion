name: Client release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./release_client.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: release/*
      - name: Publish client archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="client-${GITHUB_SHA:0:7}"
          fi
          gh release create "$tag" release/client.zip release/client.zip.sha256 --target "$GITHUB_SHA" --title "Minecraft 1.21.1 · NeoForge 21.1.264" --generate-notes
